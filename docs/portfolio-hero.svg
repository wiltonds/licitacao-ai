<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" rx="28" fill="#f7f8fa"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#111827">PUBLIC PROCUREMENT AI</text><text x="80" y="135" font-family="Arial,sans-serif" font-size="25" fill="#4b5563">Tender Intelligence · LangGraph · RAG · Human-in-the-loop</text><g font-family="Arial,sans-serif" font-size="21" font-weight="700"><rect x="70" y="225" width="220" height="120" rx="18" fill="#fff" stroke="#d1d5db"/><text x="180" y="275" text-anchor="middle">TENDER PDF</text><text x="180" y="307" text-anchor="middle">DOCUMENT</text><rect x="345" y="225" width="220" height="120" rx="18" fill="#fff" stroke="#d1d5db"/><text x="455" y="275" text-anchor="middle">STRUCTURED</text><text x="455" y="307" text-anchor="middle">EXTRACTION</text><rect x="620" y="225" width="220" height="120" rx="18" fill="#fff" stroke="#d1d5db"/><text x="730" y="275" text-anchor="middle">RAG / LEGAL</text><text x="730" y="307" text-anchor="middle">EVIDENCE</text><rect x="895" y="225" width="220" height="120" rx="18" fill="#fff" stroke="#d1d5db"/><text x="1005" y="275" text-anchor="middle">COMPLIANCE</text><text x="1005" y="307" text-anchor="middle">AGENT</text><rect x="1170" y="225" width="170" height="120" rx="18" fill="#111827"/><text x="1255" y="275" text-anchor="middle" fill="#fff">HUMAN</text><text x="1255" y="307" text-anchor="middle" fill="#fff">DECISION</text></g><g stroke="#6b7280" stroke-width="4"><path d="M290 285h55M565 285h55M840 285h55M1115 285h55"/></g><text x="80" y="460" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Evidence → Reasoning → Review</text><text x="80" y="510" font-family="Arial,sans-serif" font-size="22" fill="#4b5563">LangGraph coordinates extraction, retrieval and compliance analysis.</text><text x="80" y="600" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">AI is grounded in evidence — not autonomous legal judgment.</text></svg>